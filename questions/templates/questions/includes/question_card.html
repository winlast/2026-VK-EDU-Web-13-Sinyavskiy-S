{% load static %}
<article class="question-card p-3">
    <div class="d-flex gap-3">
        <div class="d-flex flex-column align-items-center gap-2">
            <img src="{% static question.author.avatar %}" class="question-card__avatar" alt="Аватар: {{ question.author.name }}">
            {% include 'questions/includes/vote.html' with item=question %}
        </div>
        <div class="flex-grow-1 min-w-0">
            <h2 class="question-card__title">
                <a href="{% url 'question' question.id %}">{{ question.title }}</a>
            </h2>
            <p class="question-card__text mb-2">{{ question.text }}</p>
            <div class="d-flex flex-wrap align-items-center gap-3 question-meta">
                <a href="{% url 'question' question.id %}#answers">Ответов: {{ question.answers_count }}</a>
                {% include 'questions/includes/tags.html' with tags=question.tags %}
                <time datetime="{{ question.created_at|date:'c' }}" class="ms-sm-auto">{{ question.created_at|date:'j E, H:i' }}</time>
            </div>
        </div>
    </div>
</article>
