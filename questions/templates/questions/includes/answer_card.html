{% load static %}
<article class="answer-card{% if answer.is_correct %} answer-card--correct{% endif %} p-3">
    <div class="d-flex gap-3">
        <div class="d-flex flex-column align-items-center gap-2">
            <img src="{% static answer.author.avatar %}" class="answer-card__avatar" alt="Аватар: {{ answer.author.name }}">
            {% include 'questions/includes/vote.html' with item=answer %}
        </div>
        <div class="flex-grow-1 min-w-0">
            <p class="answer-card__text">{{ answer.text }}</p>
            <div class="d-flex flex-wrap align-items-center gap-3 question-meta">
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="correct{{ answer.id }}"{% if answer.is_correct %} checked{% endif %}>
                    <label class="form-check-label" for="correct{{ answer.id }}">Правильный ответ</label>
                </div>
                <span>{{ answer.author.name }}</span>
                <time datetime="{{ answer.created_at|date:'c' }}" class="ms-sm-auto">{{ answer.created_at|date:'j E, H:i' }}</time>
            </div>
        </div>
    </div>
</article>
