services:
  db:
    image: postgres:16-alpine
    env_file: .env.docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres:
  media:
